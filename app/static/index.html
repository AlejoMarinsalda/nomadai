<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NomadAI — Tu próximo destino</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117;
      color: #e8e8e8;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      max-width: 780px;
      padding: 20px 24px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e2130;
    }

    .header-left { display: flex; align-items: center; gap: 10px; }

    header h1 {
      font-size: 1.2rem;
      font-weight: 700;
      background: linear-gradient(90deg, #6ee7b7, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header span { font-size: 1.4rem; }

    #user-info {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #9ca3af;
    }

    #user-info img {
      width: 28px;
      height: 28px;
      border-radius: 50%;
    }

    #logout-btn, #reset-profile-btn {
      background: none;
      border: 1px solid #2d3148;
      border-radius: 6px;
      color: #9ca3af;
      font-size: 0.75rem;
      padding: 3px 8px;
      cursor: pointer;
    }

    #logout-btn:hover { border-color: #6b7280; color: #e8e8e8; }
    #reset-profile-btn:hover { border-color: #ef4444; color: #ef4444; }

    /* Login screen */
    #login-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 24px;
    }

    #login-screen h2 {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(90deg, #6ee7b7, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
    }

    #login-screen p {
      color: #6b7280;
      text-align: center;
      max-width: 380px;
      line-height: 1.6;
    }

    #chat {
      flex: 1;
      width: 100%;
      max-width: 780px;
      overflow-y: auto;
      padding: 24px 24px 12px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .bubble {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .bubble.user {
      align-self: flex-end;
      background: #1d4ed8;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .bubble.assistant {
      align-self: flex-start;
      background: #1e2130;
      color: #e8e8e8;
      border-bottom-left-radius: 4px;
    }

    .bubble.assistant h3 { color: #6ee7b7; margin: 12px 0 4px; }
    .bubble.assistant h2 { color: #6ee7b7; margin: 14px 0 6px; }
    .bubble.assistant ul, .bubble.assistant ol { padding-left: 20px; }
    .bubble.assistant li { margin: 4px 0; }
    .bubble.assistant a { color: #60a5fa; }
    .bubble.assistant strong { color: #fff; }
    .bubble.assistant code {
      background: #0f1117;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.85em;
    }
    .bubble.assistant hr { border-color: #2d3148; margin: 12px 0; }

    .bubble.thinking {
      align-self: flex-start;
      background: #1e2130;
      color: #6b7280;
      font-style: italic;
      font-size: 0.88rem;
      padding: 10px 14px;
    }

    .bubble.thinking::after {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      background: #6b7280;
      border-radius: 50%;
      margin-left: 6px;
      animation: blink 1s infinite;
      vertical-align: middle;
    }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    #input-area {
      width: 100%;
      max-width: 780px;
      padding: 12px 24px 24px;
      display: flex;
      gap: 10px;
    }

    #input {
      flex: 1;
      background: #1e2130;
      border: 1px solid #2d3148;
      border-radius: 12px;
      padding: 12px 16px;
      color: #e8e8e8;
      font-size: 0.95rem;
      resize: none;
      outline: none;
      max-height: 160px;
      line-height: 1.5;
      transition: border-color 0.2s;
    }

    #input:focus { border-color: #3b82f6; }
    #input::placeholder { color: #4b5563; }

    #send {
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      border: none;
      border-radius: 12px;
      padding: 0 20px;
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
      transition: opacity 0.2s;
      align-self: flex-end;
      height: 48px;
    }

    #send:hover { opacity: 0.85; }
    #send:disabled { opacity: 0.4; cursor: not-allowed; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <span>🌍</span>
    <h1>NomadAI — Encontrá tu próximo destino</h1>
  </div>
  <div id="user-info" class="hidden">
    <img id="user-avatar" src="" alt="avatar" />
    <span id="user-name"></span>
    <button id="reset-profile-btn" title="Borrá tu perfil guardado para empezar de cero">↺ Reset</button>
    <button id="logout-btn">Salir</button>
  </div>
</header>

<!-- Pantalla de login -->
<div id="login-screen">
  <h2>Bienvenido a NomadAI</h2>
  <p>Tu asistente para encontrar el próximo destino como nómada digital. Iniciá sesión para que recuerde tu perfil entre visitas.</p>
  <div id="g_id_onload"
    data-client_id="496610892208-7ejbi9l76b71hjdd28lghc7pruu9tr1t.apps.googleusercontent.com"
    data-callback="handleGoogleLogin"
    data-auto_prompt="false">
  </div>
  <div class="g_id_signin"
    data-type="standard"
    data-size="large"
    data-theme="outline"
    data-text="signin_with"
    data-shape="rectangular"
    data-logo_alignment="left">
  </div>
</div>

<!-- Pantalla de chat (oculta hasta login) -->
<div id="chat" class="hidden"></div>

<div id="input-area" class="hidden">
  <textarea
    id="input"
    rows="1"
    placeholder="Contame sobre vos... hobbies, presupuesto, zona horaria..."
  ></textarea>
  <button id="send">➤</button>
</div>

<script>
  const API = "";
  let sessionId = null;
  let userId = null;
  let userName = null;
  let credential = null; // Google JWT — sent as Bearer token on every request

  const renderer = new marked.Renderer();
  renderer.link = ({ href, title, text }) =>
    `<a href="${href}" target="_blank" rel="noopener noreferrer"${title ? ` title="${title}"` : ""}>${text}</a>`;
  marked.use({ renderer });

  const loginScreen = document.getElementById("login-screen");
  const chatEl = document.getElementById("chat");
  const inputArea = document.getElementById("input-area");
  const userInfo = document.getElementById("user-info");
  const userAvatar = document.getElementById("user-avatar");
  const userNameEl = document.getElementById("user-name");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");

  function authHeader() {
    return credential ? { "Authorization": `Bearer ${credential}` } : {};
  }

  function handleUnauthorized() {
    ["nomadai_credential", "nomadai_user_id", "nomadai_user_name", "nomadai_user_picture"]
      .forEach(k => localStorage.removeItem(k));
    credential = null;
    userId = null;
    sessionId = null;
    chatEl.innerHTML = "";
    chatEl.classList.add("hidden");
    inputArea.classList.add("hidden");
    userInfo.classList.add("hidden");
    loginScreen.classList.remove("hidden");
    google.accounts.id.disableAutoSelect();
    addBubble("assistant", "⚠️ Tu sesión expiró. Por favor iniciá sesión de nuevo.");
    loginScreen.classList.remove("hidden");
  }

  async function handleGoogleLogin(response) {
    try {
      const res = await fetch(`${API}/auth/google`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ credential: response.credential }),
      });

      if (!res.ok) throw new Error("Auth fallida");

      const data = await res.json();
      userId = data.user_id;
      userName = data.name;
      credential = response.credential;

      localStorage.setItem("nomadai_user_id", userId);
      localStorage.setItem("nomadai_user_name", userName);
      localStorage.setItem("nomadai_user_picture", data.picture);
      localStorage.setItem("nomadai_credential", credential);

      showChat(data);
    } catch (e) {
      alert("Error al iniciar sesión. Intentá de nuevo.");
    }
  }

  async function showChat(userData) {
    loginScreen.classList.add("hidden");
    chatEl.classList.remove("hidden");
    inputArea.classList.remove("hidden");
    userInfo.classList.remove("hidden");

    userAvatar.src = userData.picture || "";
    userNameEl.textContent = userData.name || "";

    // Verificar si ya tiene perfil guardado
    const profileRes = await fetch(`${API}/profile/${userId}`, {
      headers: authHeader(),
    }).then(async r => {
      if (r.status === 401) { handleUnauthorized(); return { found: false }; }
      return r.json();
    }).catch(() => ({ found: false }));

    if (profileRes.found) {
      const firstName = (userData.name || "").split(" ")[0];
      addBubble("assistant", `¡Bienvenido de vuelta, **${firstName}**! 🎉 Ya tengo tu perfil guardado. ¿Querés explorar nuevos destinos o tenés alguna pregunta sobre tus recomendaciones anteriores?`);
    } else {
      addBubble("assistant", `¡Hola, **${userData.name.split(" ")[0]}**! 👋 Soy **NomadAI**. Te ayudo a encontrar tu próximo destino como nómada digital.\n\nContame sobre vos: ¿qué hobbies tenés, cuál es tu presupuesto mensual, desde qué zona horaria trabajás y cuál es tu nacionalidad?`);
    }

    input.focus();
  }

  // Auto-login si ya hay sesión guardada (credential no expirado)
  window.addEventListener("load", () => {
    const savedId = localStorage.getItem("nomadai_user_id");
    const savedName = localStorage.getItem("nomadai_user_name");
    const savedPicture = localStorage.getItem("nomadai_user_picture");
    const savedCredential = localStorage.getItem("nomadai_credential");
    if (savedId && savedName && savedCredential) {
      userId = savedId;
      userName = savedName;
      credential = savedCredential;
      showChat({ user_id: savedId, name: savedName, picture: savedPicture });
    }
  });

  document.getElementById("reset-profile-btn").addEventListener("click", async () => {
    if (!userId) return;
    if (!confirm("¿Borrar tu perfil guardado? La próxima vez vas a tener que completarlo de nuevo.")) return;
    await fetch(`${API}/profile/${userId}`, {
      method: "DELETE",
      headers: authHeader(),
    }).catch(() => {});
    sessionId = null;
    chatEl.innerHTML = "";
    addBubble("assistant", "Perfil borrado. Contame de nuevo sobre vos para encontrar tu próximo destino.");
    input.focus();
  });

  document.getElementById("logout-btn").addEventListener("click", () => {
    localStorage.removeItem("nomadai_credential");
    localStorage.removeItem("nomadai_user_id");
    localStorage.removeItem("nomadai_user_name");
    localStorage.removeItem("nomadai_user_picture");
    sessionId = null;
    userId = null;
    chatEl.innerHTML = "";
    chatEl.classList.add("hidden");
    inputArea.classList.add("hidden");
    userInfo.classList.add("hidden");
    loginScreen.classList.remove("hidden");
    google.accounts.id.disableAutoSelect();
  });

  function addBubble(role, html) {
    const div = document.createElement("div");
    div.className = `bubble ${role}`;
    if (role === "assistant") {
      div.innerHTML = marked.parse(html);
    } else {
      div.textContent = html;
    }
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }

  function addThinking() {
    const div = document.createElement("div");
    div.className = "bubble thinking";
    div.textContent = "Analizando tu perfil";
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }

  async function send() {
    const text = input.value.trim();
    if (!text || !userId) return;

    input.value = "";
    input.style.height = "auto";
    sendBtn.disabled = true;

    addBubble("user", text);
    const thinking = addThinking();

    try {
      // Paso 1: enviar mensaje → recibir job_id inmediatamente (~100ms)
      const res = await fetch(`${API}/chat/async`, {
        method: "POST",
        headers: { "Content-Type": "application/json", ...authHeader() },
        body: JSON.stringify({ message: text, session_id: sessionId }),
      });

      if (res.status === 401) {
        thinking.remove();
        handleUnauthorized();
        return;
      }

      const { job_id, session_id: newSessionId } = await res.json();
      sessionId = newSessionId;

      // Paso 2: hacer polling hasta que el job esté listo
      const data = await pollJob(job_id, thinking);

      thinking.remove();

      if (data.final_report) {
        addBubble("assistant", data.final_report);
      } else if (data.reply) {
        addBubble("assistant", data.reply);
      } else {
        addBubble("assistant", "⚠️ Error procesando la solicitud.");
      }
    } catch (e) {
      thinking.remove();
      addBubble("assistant", "⚠️ Error conectando con la API.");
    }

    sendBtn.disabled = false;
    input.focus();
  }

  async function pollJob(jobId, thinkingBubble) {
    const POLL_INTERVAL = 3000; // cada 3 segundos
    const MAX_WAIT = 360000;    // máximo 6 minutos
    const started = Date.now();
    let dots = 0;
    const labels = ["Analizando tu perfil", "Buscando destinos", "Enriqueciendo resultados", "Preparando tu reporte"];

    return new Promise((resolve, reject) => {
      const interval = setInterval(async () => {
        // Actualizar texto del spinner para que no se sienta estático
        dots = (dots + 1) % labels.length;
        thinkingBubble.textContent = labels[dots];

        if (Date.now() - started > MAX_WAIT) {
          clearInterval(interval);
          reject(new Error("Timeout esperando resultado"));
          return;
        }

        try {
          const res = await fetch(`${API}/chat/status/${jobId}`);
          const data = await res.json();

          if (data.status === "done" || data.status === "error") {
            clearInterval(interval);
            resolve(data);
          }
        } catch (e) {
          // ignorar errores de red transitorios, seguir polling
        }
      }, POLL_INTERVAL);
    });
  }

  sendBtn.addEventListener("click", send);

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  });
</script>

</body>
</html>
